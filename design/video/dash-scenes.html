<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard scenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* The dashboard part of the video (1:04 to 1:52), animated over real dashboard stills.
     Stills come from scripts/video/capture-dashboard.mjs (demo-mode dashboard, 1600x900 at 2x);
     nothing here redraws the dashboard: the camera moves, states crossfade, and a soft spotlight
     points at what the voiceover names.
     Stage is 1920x1080 and scales to fit.
     ?t=12.3 freezes at that page time; window.hold = 12.3 freezes a live page (file:// drops queries).
     ?bg=none makes the stage transparent. ?seg=green|home|health|whatif|activity|arena loops one
     segment (window.SEGMENTS has exact start/end in this page's time). */
  :root {
    --page: #f3f2ed;           /* the dashboard's own page color, sampled from the stills */
    --ink: #14130f;
    --muted: #6b675e;
    --hair: #e7e4db;
    --green: #1f9d5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center; overflow: hidden; background: var(--page);
  }
  .stage.nobg { background: transparent; }

  /* camera space: the still's own 1600x900 CSS pixels */
  .world { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  .world img { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; display: block; opacity: 0; }

  /* spotlight: dims everything except one box */
  .spot {
    position: absolute; border-radius: 16px; opacity: 0; pointer-events: none;
    box-shadow: 0 0 0 4000px rgba(243, 242, 237, 0.62);
  }
  .ring { position: absolute; border-radius: 14px; border: 2px solid var(--green); opacity: 0; }
  .veil { position: absolute; border-radius: 13px; background: var(--page); }

  /* track tags (stage space, bottom right, clear of the burned-in captions) */
  .tags { position: absolute; right: 56px; top: 664px; width: 490px; }
  .tags .eyebrow {
    font: 500 15px/1 'DM Mono', monospace; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px 4px; opacity: 0;
  }
  .tag {
    display: flex; align-items: center; gap: 16px; margin-bottom: 12px; padding: 16px 20px;
    background: #fff; border: 1px solid var(--hair); border-radius: 16px;
    box-shadow: 0 10px 30px -18px rgba(20, 19, 15, .35); opacity: 0;
  }
  .tag .chip { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .tag .name { font: 500 17px/1 'DM Mono', monospace; letter-spacing: .1em; color: var(--ink); width: 92px; flex: none; }
  .tag .what { font: 500 22px/1.2 'Instrument Sans', sans-serif; letter-spacing: -0.01em; color: var(--ink); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <img id="before" src="media/dash/home-before.jpg" alt="">
    <img id="done" src="media/dash/home-done.jpg" alt="">
    <img id="wopen" src="media/dash/whatif-open.jpg" alt="">
    <img id="w9" src="media/dash/whatif-9.jpg" alt="">
    <img id="w90" src="media/dash/whatif-90.jpg" alt="">
    <img id="w900" src="media/dash/whatif-900.jpg" alt="">
    <img id="activity" src="media/dash/activity.jpg" alt="">
    <img id="arena" src="media/dash/arena.jpg" alt="">
    <div id="veils"></div>
    <div class="spot" id="spot"></div>
    <div class="ring" id="ring1"></div>
    <div class="ring" id="ring2"></div>
  </div>

  <div class="tags" id="tags">
    <div class="eyebrow" id="eyebrow">Tracks</div>
    <div class="tag"><span class="chip" style="background:#F24E2C"></span><span class="name">PNC</span><span class="what">Your whole money picture</span></div>
    <div class="tag"><span class="chip" style="background:#F7AC33"></span><span class="name">NVIDIA</span><span class="what">Nemotron does the work</span></div>
    <div class="tag"><span class="chip" style="background:#1F9D5C"></span><span class="name">Photon</span><span class="what">Lives in iMessage and calls</span></div>
  </div>
</div>

<script>
// ---- segments, in this page's time (the video's 1:04 to 1:52) ----
const SEGMENTS = {
  green:    { start: 0,  end: 2 },   // tail of "done": the dip sweeps green
  home:     { start: 2,  end: 16 },  // "whatitis", Yoshua's voiceover, track tags
  health:   { start: 16, end: 24 },
  whatif:   { start: 24, end: 32 },
  activity: { start: 32, end: 40 },
  arena:    { start: 40, end: 48 },
};
window.SEGMENTS = SEGMENTS;
window.TIMELINE_END = 48;

// ---- boxes on the stills, in still CSS px (from media/dash/manifest.json, checked by eye) ----
const R = {
  stats: [
    { x: 52,  y: 681, w: 263, h: 135 },   // Emergency fund
    { x: 323, y: 681, w: 263, h: 135 },   // Card use
    { x: 594, y: 681, w: 263, h: 135 },   // Debt vs. income
    { x: 865, y: 681, w: 263, h: 135 },   // Net worth (8 accounts)
  ],
  purchase: { x: 1168, y: 560, w: 361, h: 60 },    // Try a purchase field
  result:   { x: 1166, y: 558, w: 365, h: 198 },   // the 900 field plus $100 -> -$800, Overdraws checking
  pill:     { x: 79,   y: 200, w: 364, h: 40 },    // If you spend it: lowest -$800
  chip:     { x: 236,  y: 190, w: 159, h: 25 },    // NEMOTRON NANO 2 VL
  chipRow:  { x: 230,  y: 164, w: 172, h: 53 },    // Read the repair quote + its model label
  limits:   { x: 1016, y: 256, w: 198, h: 88 },
  disclose: { x: 1226, y: 256, w: 198, h: 88 },
  zeros:    { x: 1010, y: 250, w: 420, h: 100 },   // both zero cards
  grid:     { x: 176, y: 363, cols: 10, rows: 5, tw: 115.4, th: 71.4, px: 125.8, py: 82.2 },
};

// ---- camera keys: [t, centerX, centerY, zoom] in still px; zoom 1 = the still fills the stage ----
const KEYS = [
  [0.0, 560, 410, 1.30],
  [2.0, 800, 455, 1.04],
  [16.0, 800, 450, 1.00],
  [17.2, 590, 748, 1.45],
  [24.0, 600, 745, 1.50],
  [25.3, 900, 470, 1.05],
  [26.7, 900, 470, 1.07],
  [28.0, 1300, 690, 1.60],
  [29.6, 1310, 695, 1.62],
  [31.0, 640, 350, 1.30],
  [32.0, 650, 352, 1.32],
  [33.4, 440, 240, 1.65],
  [36.8, 446, 246, 1.68],
  [40.0, 520, 480, 1.40],
  [41.1, 800, 470, 1.12],
  [43.4, 800, 468, 1.13],
  [44.8, 800, 232, 1.25],
  [48.0, 804, 234, 1.27],
];

// ---- helpers ----
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (p) => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const easeOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const lerp = (a, b, p) => a + (b - a) * p;
const fadeIn = (t, at, dur) => easeOut((t - at) / dur);
const window01 = (t, a, b, fin = 0.3, fout = 0.35) => Math.min(fadeIn(t, a, fin), 1 - fadeIn(t, b - fout, fout));
const lerpRect = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p) });
const pad = (r, n) => ({ x: r.x - n, y: r.y - n, w: r.w + 2 * n, h: r.h + 2 * n });
const place = (el, r) => { el.style.left = `${r.x}px`; el.style.top = `${r.y}px`; el.style.width = `${r.w}px`; el.style.height = `${r.h}px`; };

const stage = $('stage'), world = $('world');
const params = new URLSearchParams(location.search);
const TAG_AT = (() => { const v = (params.get('tags') || '').split(',').map(Number).filter((n) => n > 0); return v.length === 3 ? v : null; })();
const TAGS_FROM = params.get('tagsfrom') ? Number(params.get('tagsfrom')) : null;
if (params.get('bg') === 'none') stage.classList.add('nobg');
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

// arena tile veils (hide tiles, then reveal them in a diagonal wave)
const G = R.grid;
const veils = [];
for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) {
  const v = document.createElement('div');
  v.className = 'veil';
  place(v, pad({ x: G.x + c * G.px, y: G.y + r * G.py, w: G.tw, h: G.th }, 3));
  v.dataset.delay = (c + r) * 0.05;
  $('veils').appendChild(v);
  veils.push(v);
}
const tags = [...document.querySelectorAll('.tag')];

function camera(t) {
  let k = 0;
  while (k + 1 < KEYS.length && KEYS[k + 1][0] <= t) k++;
  const a = KEYS[k], b = KEYS[Math.min(k + 1, KEYS.length - 1)];
  const p = b[0] === a[0] ? 0 : ease((t - a[0]) / (b[0] - a[0]));
  return { cx: lerp(a[1], b[1], p), cy: lerp(a[2], b[2], p), z: lerp(a[3], b[3], p) };
}

/** Where the spotlight is and how strong, at time t. */
function spotAt(t) {
  // health: one score at a time, left to right
  if (t >= 17.0 && t < 23.4) {
    const starts = [17.2, 18.7, 20.2, 21.7];
    let k = 0; while (k + 1 < starts.length && t >= starts[k + 1]) k++;
    const rect = k === 0 ? R.stats[0] : lerpRect(R.stats[k - 1], R.stats[k], ease((t - starts[k]) / 0.4));
    return { rect: pad(rect, 6), a: window01(t, 17.1, 23.4, 0.35, 0.5) };
  }
  // what if: the field while it types, then the result
  if (t >= 25.2 && t < 29.8) {
    const rect = t < 27.4 ? R.purchase : lerpRect(R.purchase, R.result, ease((t - 27.4) / 0.5));
    return { rect: pad(rect, 6), a: window01(t, 25.3, 29.8, 0.3, 0.45) * 0.85 };
  }
  // the overdraft pill on the redrawn chart
  if (t >= 30.6 && t < 32.0) return { rect: pad(R.pill, 4), a: window01(t, 30.7, 32.0, 0.3, 0.4) * 0.6 };
  // activity: hold on the Nemotron model label
  if (t >= 33.3 && t < 37.1) return { rect: pad(R.chipRow, 6), a: window01(t, 33.4, 37.1, 0.35, 0.45) };
  // arena: the two zero cards
  if (t >= 45.0) return { rect: pad(R.zeros, 2), a: fadeIn(t, 45.1, 0.5) * 0.75 };
  return { rect: R.chip, a: 0 };
}

function render(t) {
  // camera
  const { cx, cy, z } = camera(t);
  const s = 1.2 * z;
  world.style.transform = `translate(960px, 540px) scale(${s}) translate(${-cx}px, ${-cy}px)`;

  // stills, stacked in story order; each later one fades in over the one before
  const show = {
    before: 1,
    done: t >= 0.3 ? 1 : 0,
    wopen: fadeIn(t, 24.2, 0.7),
    w9: fadeIn(t, 25.6, 0.08),
    w90: fadeIn(t, 25.95, 0.08),
    w900: fadeIn(t, 26.3, 0.12),
    activity: fadeIn(t, 32.0, 0.7),
    arena: fadeIn(t, 40.0, 0.7),
  };
  // the dip sweeping green: Done wipes in left to right over the red Heads-up state
  const wipe = ease((t - 0.3) / 1.3);
  const doneEl = $('done');
  if (wipe < 1) {
    const edge = lerp(-8, 108, wipe);
    doneEl.style.maskImage = doneEl.style.webkitMaskImage =
      `linear-gradient(90deg, #000 ${edge - 8}%, transparent ${edge + 8}%)`;
  } else doneEl.style.maskImage = doneEl.style.webkitMaskImage = 'none';
  // only keep layers that can be seen (a layer is hidden once one above it is fully opaque)
  const order = ['before', 'done', 'wopen', 'w9', 'w90', 'w900', 'activity', 'arena'];
  let covered = false;
  for (let i = order.length - 1; i >= 0; i--) {
    const k = order[i];
    $(k).style.opacity = covered ? 0 : show[k];
    if (show[k] >= 1 && !(k === 'done' && wipe < 1)) covered = true;
  }

  // spotlight
  const sp = spotAt(t);
  const spot = $('spot');
  place(spot, sp.rect);
  spot.style.opacity = sp.a;
  spot.style.borderRadius = sp.rect.h < 50 ? '10px' : '16px';

  // green rings: the model label, then the two zero cards
  const r1 = $('ring1'), r2 = $('ring2');
  if (t >= 33.3 && t < 37.2) {
    place(r1, pad(R.chip, 4)); r1.style.borderRadius = '9px';
    r1.style.opacity = window01(t, 33.7, 37.1, 0.3, 0.45);
    r2.style.opacity = 0;
  } else if (t >= 45.2) {
    place(r1, pad(R.limits, 1)); place(r2, pad(R.disclose, 1));
    r1.style.borderRadius = r2.style.borderRadius = '15px';
    r1.style.opacity = fadeIn(t, 45.4, 0.4);
    r2.style.opacity = fadeIn(t, 45.7, 0.4);
  } else { r1.style.opacity = 0; r2.style.opacity = 0; }

  // arena tiles reveal in a diagonal wave, in step with the arena fading in
  for (const v of veils) {
    const reveal = fadeIn(t, 40.5 + +v.dataset.delay, 0.3);
    v.style.opacity = show.arena * (1 - reveal);
  }

  // track tags during "home"
  // ?tags=a,b,c (page seconds) puts each tag on the word that names it; ?tagsfrom= brings in the label
  const out = 1 - fadeIn(t, 15.2, 0.6);
  $('eyebrow').style.opacity = Math.min(fadeIn(t, TAGS_FROM ?? 3.6, 0.4), out);
  tags.forEach((el, i) => {
    const p = TAG_AT ? fadeIn(t, TAG_AT[i] - 0.08, 0.35) : fadeIn(t, 4.0 + i * 1.6, 0.6);
    el.style.opacity = Math.min(p, out);
    el.style.transform = `translateY(${(1 - p) * 14}px)`;
  });
}
window.render = render;

// ---- clock: ?t= freezes, window.hold freezes a live page, ?seg= loops one segment ----
const frozen = params.get('t');
const seg = SEGMENTS[params.get('seg')];
const imgs = [...document.images].map((im) => im.complete ? Promise.resolve() : new Promise((r) => { im.onload = im.onerror = r; }));
Promise.all([document.fonts.ready, ...imgs]).then(() => {
  if (frozen !== null) { render(parseFloat(frozen)); return; }
  const t0 = performance.now();
  const tick = () => {
    let t = (performance.now() - t0) / 1000;
    t = seg ? seg.start + (t % (seg.end - seg.start)) : t % (window.TIMELINE_END + 1);
    render(window.hold ?? t);
    requestAnimationFrame(tick);
  };
  tick();
});
</script>
</body>
</html>
