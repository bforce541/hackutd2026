<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Generated iMessage screen for the video's text beat (we don't screen-record the iPhone).
     Every word comes from thread.js, which scripts/video/export-thread.mjs writes from the server.
     Stage is 1920x1080 and scales to fit.
     ?t=12.3 freezes at that time; window.hold = 12.3 freezes a live page (file:// drops query strings).
     ?bg=none drops the backdrop. ?seg=precall|approve|done loops one segment (see window.SEGMENTS). */
  :root {
    --blue: #0b84fe;
    --grey: #e9e9eb;
    --ink: #000;
    --sub: #8e8e93;
    --hair: #d1d1d6;
    --screen: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }

  .stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 70% at 40% 45%, #202327 0%, transparent 70%),
      linear-gradient(180deg, #15171a 0%, #0b0b0c 100%);
  }
  .stage.nobg { background: transparent; }
  .note {
    position: absolute; top: 40px; right: 56px; text-align: right;
    font: 400 20px/1.5 'DM Mono', monospace; color: rgba(245,244,240,.32); letter-spacing: .08em;
  }
  .stage.nobg .note { display: none; }

  /* camera: the zoom onto the key line moves this, never the layout */
  .cam { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }

  /* ---- iPhone ---- */
  .phone {
    position: absolute; left: 540px; top: 50%;
    width: 393px; height: 852px; margin-top: -426px;
    transform: scale(1.14); transform-origin: center;
    border-radius: 56px; background: var(--screen);
    box-shadow: 0 0 0 12px #1b1b1d, 0 0 0 13.5px #3a3a3d, 0 40px 90px rgba(0,0,0,.55);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--ink);
  }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 5; }

  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 4;
    display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 46px;
    font-weight: 600; font-size: 17px; letter-spacing: -0.2px;
  }
  .status .icons { display: flex; gap: 7px; align-items: center; }

  .header {
    position: absolute; top: 54px; left: 0; right: 0; height: 92px; z-index: 3;
    background: rgba(247,247,247,.94); border-bottom: 0.5px solid var(--hair);
    display: grid; grid-template-columns: 60px 1fr 60px; align-items: start;
  }
  .header .back { padding: 12px 0 0 12px; }
  .header .who { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .header .who img { width: 54px; height: 54px; border-radius: 50%; display: block; }
  .header .who span { margin-top: 4px; font-size: 12px; color: var(--ink); display: inline-flex; align-items: center; gap: 2px; }
  .header .who span::after { content: '›'; color: var(--sub); font-size: 14px; line-height: 1; margin-left: 2px; }

  .viewport { position: absolute; top: 146px; bottom: 84px; left: 0; right: 0; overflow: hidden; }
  .content { position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px 12px; will-change: transform; }
  .daystamp { text-align: center; color: var(--sub); font-size: 12px; line-height: 15px; margin-bottom: 12px; }
  .daystamp b { font-weight: 600; }

  .msg { display: flex; margin-top: 2px; opacity: 0; transform-origin: bottom; }
  .msg.first { margin-top: 10px; }
  .msg.me { flex-direction: column; align-items: flex-end; transform-origin: bottom right; }
  /* read receipt: only the latest sent message shows it, "Delivered" then "Read" */
  .receipt { height: 17px; padding: 2px 4px 0 0; font-size: 11px; line-height: 15px; color: var(--sub); letter-spacing: -0.1px; }
  .receipt b { font-weight: 600; }
  .msg.pacepay { justify-content: flex-start; transform-origin: bottom left; }

  .bubble {
    position: relative; max-width: 272px; padding: 7px 13px 8px;
    border-radius: 19px; font-size: 17px; line-height: 22px; letter-spacing: -0.25px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .me .bubble { background: var(--blue); color: #fff; }
  .pacepay .bubble { background: var(--grey); color: var(--ink); }
  /* classic tails on the last bubble of a group */
  .tail .bubble::before, .tail .bubble::after { content: ''; position: absolute; bottom: 0; height: 20px; }
  .me.tail .bubble::before { right: -7px; width: 20px; background: var(--blue); border-bottom-left-radius: 16px 14px; }
  .me.tail .bubble::after { right: -26px; width: 26px; background: var(--screen); border-bottom-left-radius: 10px; }
  .pacepay.tail .bubble::before { left: -7px; width: 20px; background: var(--grey); border-bottom-right-radius: 16px 14px; }
  .pacepay.tail .bubble::after { left: -26px; width: 26px; background: var(--screen); border-bottom-right-radius: 10px; }

  .photo { display: block; border-radius: 18px; overflow: hidden; border: 0.5px solid rgba(0,0,0,.08); }
  .photo img { display: block; width: 100%; height: auto; }
  .me .photo { width: 190px; }
  .pacepay .photo { width: 262px; }

  .mark { border-radius: 4px; background-repeat: no-repeat; background-image: linear-gradient(rgba(255, 204, 0, .55), rgba(255, 204, 0, .55)); background-size: 0% 100%; padding: 0 1px; margin: 0 -1px; }

  .typing {
    position: absolute; left: 16px; display: flex; gap: 5px; align-items: center;
    background: var(--grey); border-radius: 19px; padding: 0 14px; height: 38px; opacity: 0;
  }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: #9a9aa0; display: block; }

  .compose {
    position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--screen);
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px 0;
  }
  .compose .plus { width: 34px; height: 34px; border-radius: 50%; background: #e9e9eb; display: grid; place-items: center; flex: none; }
  .compose .field {
    flex: 1; height: 36px; border: 1px solid var(--hair); border-radius: 18px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px;
    color: #c4c4c7; font-size: 17px;
  }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #000; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="note" id="note"></div>
  <div class="cam" id="cam">
    <div class="phone" id="phone">
      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <span class="icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.6 0-1.1.2-1.5.6L8 11.5l1.5-1.6c-.4-.4-.9-.6-1.5-.6Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".45"/></svg>
        </span>
      </div>
      <div class="header">
        <div class="back"><svg width="13" height="22" viewBox="0 0 13 22" aria-hidden="true"><path d="M11 2 2 11l9 9" fill="none" stroke="#0b84fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="who"><img src="../brand/pacepay-avatar.svg" alt=""><span>PacePay</span></div>
        <div></div>
      </div>
      <div class="viewport" id="viewport">
        <div class="content" id="content">
          <div class="daystamp"><b>iMessage</b><br>Today 9:41 AM</div>
          <div id="list"></div>
          <div class="typing" id="typing"><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="compose">
        <div class="plus"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="#7c7c80" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="field"><span>iMessage</span><svg width="14" height="20" viewBox="0 0 14 20"><rect x="4" y="1" width="6" height="11" rx="3" fill="#c4c4c7"/><path d="M1.5 9a5.5 5.5 0 0 0 11 0M7 14.5V18" fill="none" stroke="#c4c4c7" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      </div>
      <div class="home"></div>
    </div>
  </div>
</div>

<script src="thread.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const stage = $('stage'), cam = $('cam'), content = $('content'), list = $('list'), typing = $('typing'), viewport = $('viewport');
const params = new URLSearchParams(location.search);
if (params.get('bg') === 'none') stage.classList.add('nobg');

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function loadThread() {
  if (window.THREAD) return window.THREAD;
  try { const r = await fetch('thread.json'); if (r.ok) return r.json(); } catch {}
  return { placeholder: true, messages: [] };
}

// ---- timing: waits trimmed, a short typing indicator before each PacePay message ----
const TYPING = 0.55, REPLY_GAP = 0.3, SLIDE = 0.35;
const KEY = /[−-]\$\d[\d,]*/; // the line that says checking goes negative

function dwell(m) {
  if (m.kind === 'image') return m.from === 'me' ? 1.0 : 1.3;
  return clamp(0.5 + m.text.length * 0.02, 0.9, 2.2);
}

function build(thread) {
  const msgs = thread.messages;
  let cursor = 0.4;
  const items = msgs.map((m, i) => {
    const prev = msgs[i - 1], next = msgs[i + 1];
    const it = { ...m, i, first: !prev || prev.from !== m.from, last: !next || next.from !== m.from };
    if (m.from === 'pacepay') { it.typingAt = cursor; it.at = cursor + TYPING; }
    else { it.at = cursor + (prev && prev.from === 'pacepay' ? REPLY_GAP : 0); }
    cursor = it.at + dwell(m);
    // our texts: "Delivered" as it lands, "Read" a beat later (before PacePay starts typing)
    if (m.from === 'me') it.readAt = Math.min(it.at + 0.4, cursor);
    if (m.kind === 'text' && KEY.test(m.text)) { it.key = true; it.hlAt = it.at + 0.6; it.hlEnd = it.hlAt + 1.5 + 0.8; cursor = it.hlEnd + 0.4; }
    return it;
  });
  const end = cursor + 0.6;

  list.innerHTML = items.map((it) => {
    const cls = `msg ${it.from}${it.first ? ' first' : ''}${it.last && it.kind === 'text' ? ' tail' : ''}`;
    const receipt = it.from === 'me' ? '<div class="receipt"></div>' : '';
    if (it.kind === 'image') return `<div class="${cls}" data-i="${it.i}"><div class="photo"><img src="${it.image}" alt=""></div>${receipt}</div>`;
    let html = esc(it.text);
    if (it.key) {
      // highlight the first line (up to the first newline, or the first sentence)
      const line = it.text.split('\n')[0];
      const cut = line.indexOf(' (') > 0 ? line.indexOf(' (') : line.length;
      html = `<span class="mark" id="mark">${esc(line.slice(0, cut))}</span>${esc(it.text.slice(cut))}`;
    }
    return `<div class="${cls}" data-i="${it.i}"><div class="bubble">${html}</div>${receipt}</div>`;
  }).join('');

  // segments the edit cuts in: before the call, the approval mid-call, the Done text after it
  const find = (re) => items.find((it) => it.kind === 'text' && re.test(it.text));
  const calling = find(/Calling your lender/i), approve = find(/Approve\?/i), done = find(/^Done\./);
  const startOf = (it) => (it.typingAt ?? it.at) - 0.3;
  const SEGMENTS = {};
  if (calling) SEGMENTS.precall = { start: 0, end: +(calling.at + 1.4).toFixed(2) };
  if (approve) {
    const yes = items[approve.i + 1];
    SEGMENTS.approve = { start: +startOf(approve).toFixed(2), end: +((yes && yes.from === 'me' ? yes.at : approve.at + 2) + 1.2).toFixed(2) };
  }
  if (done) SEGMENTS.done = { start: +startOf(done).toFixed(2), end: +(done.at + 2.6).toFixed(2) };
  window.SEGMENTS = SEGMENTS;
  window.TIMELINE_END = +end.toFixed(2);
  window.TIMES = items.map((it) => ({ i: it.i, from: it.from, at: +it.at.toFixed(2), ...(it.key ? { highlight: [+it.hlAt.toFixed(2), +it.hlEnd.toFixed(2)] } : {}) }));
  return { items, end };
}

let T = null, nodes = [], layout = null;

function measure() {
  nodes = [...list.children];
  layout = nodes.map((n) => ({ top: n.offsetTop, bottom: n.offsetTop + n.offsetHeight }));
  // scroll stops: where the bottom of the thread is after each event (typing starts or a message lands)
  const vh = viewport.clientHeight, pad = 14;
  const stops = [{ t: -1, y: 0 }];
  T.items.forEach((it, k) => {
    // offsets are already relative to .content (the positioned parent)
    if (it.typingAt !== undefined) stops.push({ t: it.typingAt, y: Math.max(0, layout[k].top + 38 + pad - vh) });
    stops.push({ t: it.at, y: Math.max(0, layout[k].bottom + pad - vh) });
  });
  stops.sort((a, b) => a.t - b.t);
  layout.stops = stops;
}

function scrollAt(t) {
  const s = layout.stops;
  let k = 0;
  while (k + 1 < s.length && s[k + 1].t <= t) k++;
  const cur = s[k], prev = s[k - 1] || cur;
  return prev.y + (cur.y - prev.y) * ease((t - cur.t) / SLIDE);
}

function render(t) {
  if (!T) return;
  const { items } = T;

  // messages
  let typingFor = null;
  items.forEach((it, k) => {
    const n = nodes[k];
    const p = easeOut((t - it.at) / 0.28);
    n.style.opacity = t >= it.at ? p : 0;
    n.style.transform = t >= it.at ? `translateY(${(1 - p) * 10}px) scale(${0.96 + 0.04 * p})` : 'none';
    if (it.typingAt !== undefined && t >= it.typingAt && t < it.at) typingFor = k;
  });

  // read receipt under the latest sent message only
  let latestMe = -1;
  items.forEach((it, k) => { if (it.from === 'me' && t >= it.at) latestMe = k; });
  items.forEach((it, k) => {
    if (it.from !== 'me') return;
    const r = nodes[k].querySelector('.receipt');
    const html = k !== latestMe ? '' : t >= it.readAt ? '<b>Read</b> 9:41 AM' : 'Delivered';
    if (r.innerHTML !== html) r.innerHTML = html;
  });

  // typing indicator, in the slot the next message will take
  if (typingFor !== null) {
    const it = items[typingFor];
    typing.style.top = `${layout[typingFor].top}px`;
    const p = easeOut((t - it.typingAt) / 0.2);
    typing.style.opacity = p;
    [...typing.children].forEach((d, j) => { d.style.opacity = 0.35 + 0.65 * Math.max(0, Math.sin((t * 5.2) - j * 0.9)); });
  } else typing.style.opacity = 0;

  content.style.transform = `translateY(${-scrollAt(t)}px)`;

  // the key line: marker sweep plus a gentle zoom so it can be read
  const keyIt = items.find((it) => it.key);
  const mark = $('mark');
  cam.style.transform = 'none';
  if (keyIt && mark) {
    const sweep = easeOut((t - keyIt.hlAt) / 0.5);
    mark.style.backgroundSize = `${t >= keyIt.hlAt ? sweep * 100 : 0}% 100%`;
    const k = ease((t - keyIt.hlAt + 0.2) / 0.45) * (1 - ease((t - (keyIt.hlEnd - 0.45)) / 0.45));
    if (k > 0) {
      const sr = stage.getBoundingClientRect(), mr = mark.getBoundingClientRect();
      const sc = sr.width / 1920;
      const fx = (mr.left + mr.width / 2 - sr.left) / sc, fy = (mr.top + mr.height / 2 - sr.top) / sc;
      const z = 1 + 0.42 * k;
      const tx = (960 - fx) * 0.55 * k, ty = (540 - fy) * 0.55 * k;
      cam.style.transform = `translate(${tx}px, ${ty}px) translate(${fx}px, ${fy}px) scale(${z}) translate(${-fx}px, ${-fy}px)`;
    }
  }
}

(async () => {
  const thread = await loadThread();
  $('note').innerHTML = thread.placeholder ? 'PLACEHOLDER THREAD<br>run scripts/video/export-thread.mjs after the take' : '';
  T = build(thread);
  await document.fonts.ready;
  await Promise.all([...list.querySelectorAll('img')].map((img) => img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; })));
  measure();

  const frozen = params.get('t');
  const seg = window.SEGMENTS[params.get('seg')];
  if (frozen !== null) { render(parseFloat(frozen)); return; }
  const t0 = performance.now();
  const tick = () => {
    let t = (performance.now() - t0) / 1000;
    t = seg ? seg.start + (t % (seg.end - seg.start + 1)) : t % (T.end + 1.5);
    render(window.hold ?? t);
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
</body>
</html>
