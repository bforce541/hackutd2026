<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="PacePay architecture: iMessage to Photon to the PacePay server, which uses Nemotron to plan, read bills and negotiate, a money engine for all math, Claude as a second opinion, LiveKit and GPT realtime to call the lender, and a live dashboard.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#3d3b37"/></marker>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #14130f; }
      .t { font-size: 22px; font-weight: 700; }
      .h { font-size: 18px; font-weight: 700; }
      .b { font-size: 15px; fill: #3d3b37; }
      .s { font-size: 14px; fill: #6b675e; }
      .l { font-size: 14px; fill: #3d3b37; font-weight: 600; }
      .w { fill: #ffffff; }
      .box { stroke-width: 1.5; }
      .arrow { stroke: #3d3b37; stroke-width: 2; fill: none; marker-end: url(#a); }
      .arrow2 { stroke: #3d3b37; stroke-width: 2; fill: none; marker-end: url(#a); marker-start: url(#a); }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#f4f2ec"/>

  <!-- Title + logo tiles -->
  <g transform="translate(40 34)">
    <rect x="0" y="12" width="14" height="14" rx="3.5" fill="#F24E2C"/><rect x="8" y="19" width="14" height="14" rx="3.5" fill="#FF8A3D" fill-opacity=".9"/><rect x="16" y="24" width="14" height="14" rx="3.5" fill="#F7AC33" fill-opacity=".9"/><rect x="25" y="14" width="14" height="14" rx="3.5" fill="#86C254" fill-opacity=".9"/><rect x="31" y="4" width="17" height="17" rx="4" fill="#1F9D5C"/>
    <text x="64" y="30" font-size="30" font-weight="700" style="font-size:30px;font-weight:700;letter-spacing:-0.5px">PacePay architecture</text>
  </g>
  <text x="40" y="100" class="b">Nemotron decides. Code does all the math. Claude checks. GPT only speaks. Yoshua approves.</text>

  <!-- Yoshua's iPhone -->
  <rect x="40" y="240" width="220" height="140" rx="14" fill="#fff" stroke="#8c887e" class="box"/>
  <text x="150" y="278" text-anchor="middle" class="h">Yoshua's iPhone</text>
  <text x="150" y="306" text-anchor="middle" class="b">Text a bill photo</text>
  <text x="150" y="327" text-anchor="middle" class="b">Pick an option</text>
  <text x="150" y="348" text-anchor="middle" class="b">Reply YES mid-call</text>

  <!-- Lender phone -->
  <rect x="40" y="680" width="220" height="140" rx="14" fill="#fff" stroke="#8c887e" class="box"/>
  <text x="150" y="718" text-anchor="middle" class="h">The lender</text>
  <text x="150" y="746" text-anchor="middle" class="b">A real phone rings</text>
  <text x="150" y="767" text-anchor="middle" class="b">Hears an AI assistant</text>
  <text x="150" y="788" text-anchor="middle" class="b">with Yoshua's permission</text>

  <!-- Photon -->
  <rect x="300" y="150" width="170" height="730" rx="16" fill="#fdeae4" stroke="#c23718" class="box"/>
  <text x="385" y="186" text-anchor="middle" class="h">Photon 2.0</text>
  <rect x="318" y="225" width="134" height="170" rx="12" fill="#fff" stroke="#c23718" class="box"/>
  <text x="385" y="258" text-anchor="middle" class="h">iMessage</text>
  <text x="385" y="284" text-anchor="middle" class="b">text, photo,</text>
  <text x="385" y="304" text-anchor="middle" class="b">chart in, text</text>
  <text x="385" y="324" text-anchor="middle" class="b">out. PacePay</text>
  <text x="385" y="344" text-anchor="middle" class="b">can text first.</text>
  <rect x="318" y="665" width="134" height="170" rx="12" fill="#fff" stroke="#c23718" class="box"/>
  <text x="385" y="698" text-anchor="middle" class="h">Voice number</text>
  <text x="385" y="724" text-anchor="middle" class="b">SIP over TLS,</text>
  <text x="385" y="744" text-anchor="middle" class="b">outbound and</text>
  <text x="385" y="764" text-anchor="middle" class="b">inbound calls</text>

  <!-- Server container -->
  <rect x="540" y="130" width="500" height="750" rx="18" fill="#fff" stroke="#14130f" class="box"/>
  <text x="565" y="166" class="t">PacePay server</text>
  <text x="565" y="188" class="s">TypeScript, Hono. Runs on the presenter's laptop.</text>

  <rect x="565" y="205" width="450" height="64" rx="10" fill="#faf6e8" stroke="#c98700" class="box"/>
  <text x="790" y="232" text-anchor="middle" class="h">State machine: hard gates in code</text>
  <text x="790" y="254" text-anchor="middle" class="s">No call without your OK. No deal without your YES.</text>

  <!-- Nemotron roles -->
  <rect x="565" y="290" width="215" height="98" rx="10" fill="#e4f1e9" stroke="#17794a" class="box"/>
  <text x="672" y="318" text-anchor="middle" class="h">Planner</text>
  <text x="672" y="341" text-anchor="middle" class="b">Nemotron 3 Ultra</text>
  <text x="672" y="362" text-anchor="middle" class="s">Plans each event and call</text>

  <rect x="800" y="290" width="215" height="98" rx="10" fill="#e4f1e9" stroke="#17794a" class="box"/>
  <text x="907" y="318" text-anchor="middle" class="h">Orchestrator</text>
  <text x="907" y="341" text-anchor="middle" class="b">Nemotron 3 Super</text>
  <text x="907" y="362" text-anchor="middle" class="s">Runs tools, ranks options</text>

  <rect x="565" y="406" width="215" height="98" rx="10" fill="#e4f1e9" stroke="#17794a" class="box"/>
  <text x="672" y="434" text-anchor="middle" class="h">Bill reader</text>
  <text x="672" y="457" text-anchor="middle" class="b">Nemotron Nano 2 VL</text>
  <text x="672" y="478" text-anchor="middle" class="s">Reads the photo of the quote</text>

  <rect x="800" y="406" width="215" height="98" rx="10" fill="#e4f1e9" stroke="#17794a" class="box"/>
  <text x="907" y="434" text-anchor="middle" class="h">Negotiator: decide()</text>
  <text x="907" y="457" text-anchor="middle" class="b">Nemotron 3 Super</text>
  <text x="907" y="478" text-anchor="middle" class="s">Offer in, reply out</text>

  <!-- Money engine -->
  <rect x="565" y="526" width="450" height="112" rx="10" fill="#14130f"/>
  <text x="790" y="560" text-anchor="middle" class="h w">Money engine: plain code, no model</text>
  <text x="790" y="585" text-anchor="middle" class="w" style="font-size:15px">60-day forecast · health scores · what-ifs</text>
  <text x="790" y="607" text-anchor="middle" class="w" style="font-size:15px">check_offer judges every offer against your limits</text>
  <text x="790" y="627" text-anchor="middle" style="font-size:13px;fill:#c9c5ba">Same code runs in the browser. 60 unit tests.</text>

  <!-- Tools + watcher -->
  <rect x="565" y="658" width="450" height="80" rx="10" fill="#fbfaf7" stroke="#8c887e" class="box"/>
  <text x="790" y="685" text-anchor="middle" class="h">Tools</text>
  <text x="790" y="709" text-anchor="middle" class="s">send_chart · request_approval · get_terms · place_call</text>
  <text x="790" y="727" text-anchor="middle" class="s">simulate · check_offer · schedule_followup</text>

  <rect x="565" y="758" width="215" height="96" rx="10" fill="#fbfaf7" stroke="#8c887e" class="box"/>
  <text x="672" y="786" text-anchor="middle" class="h">Watcher</text>
  <text x="672" y="808" text-anchor="middle" class="s">Daily check: tight week,</text>
  <text x="672" y="826" text-anchor="middle" class="s">late paycheck, CD alert</text>
  <rect x="800" y="758" width="215" height="96" rx="10" fill="#fbfaf7" stroke="#8c887e" class="box"/>
  <text x="907" y="786" text-anchor="middle" class="h">State</text>
  <text x="907" y="808" text-anchor="middle" class="s">In memory with a JSON</text>
  <text x="907" y="826" text-anchor="middle" class="s">snapshot. Event stream.</text>

  <!-- Right column -->
  <rect x="1140" y="150" width="320" height="190" rx="14" fill="#fff" stroke="#17794a" class="box"/>
  <text x="1300" y="186" text-anchor="middle" class="h">Dashboard</text>
  <text x="1300" y="210" text-anchor="middle" class="b">Next.js on Vercel</text>
  <text x="1300" y="240" text-anchor="middle" class="s">Pace line · health scores · what-if</text>
  <text x="1300" y="260" text-anchor="middle" class="s">Messages · Activity · Accounts · Arena</text>
  <text x="1300" y="288" text-anchor="middle" class="s">Activity labels the model behind</text>
  <text x="1300" y="306" text-anchor="middle" class="s">every step. Runs the same engine.</text>

  <rect x="1140" y="380" width="320" height="170" rx="14" fill="#fbf0d8" stroke="#c98700" class="box"/>
  <text x="1300" y="416" text-anchor="middle" class="h">Claude Opus 5.5</text>
  <text x="1300" y="440" text-anchor="middle" class="b">A different model family checks</text>
  <text x="1300" y="470" text-anchor="middle" class="s">Second opinion on the call plan</text>
  <text x="1300" y="490" text-anchor="middle" class="s">Cross-check of the bill amount and date</text>
  <text x="1300" y="510" text-anchor="middle" class="s">Grades every Arena transcript</text>

  <rect x="1140" y="640" width="320" height="190" rx="14" fill="#ffe9d6" stroke="#c4560a" class="box"/>
  <text x="1300" y="676" text-anchor="middle" class="h">LiveKit + GPT realtime</text>
  <text x="1300" y="700" text-anchor="middle" class="b">Hearing, speaking, turn-taking</text>
  <text x="1300" y="732" text-anchor="middle" class="s">Never sees balances or limits.</text>
  <text x="1300" y="752" text-anchor="middle" class="s">For each offer it asks decide()</text>
  <text x="1300" y="772" text-anchor="middle" class="s">and says what comes back.</text>
  <text x="1300" y="800" text-anchor="middle" class="s">Discloses it is an AI on every call.</text>

  <!-- Arrows -->
  <path class="arrow2" d="M260 310 H300"/>
  <path class="arrow2" d="M470 310 H540"/>
  <text x="505" y="296" text-anchor="middle" class="l">texts</text>

  <path class="arrow" d="M1040 230 H1140"/>
  <text x="1090" y="218" text-anchor="middle" class="l">live events</text>

  <path class="arrow2" d="M1040 460 H1140"/>
  <text x="1090" y="448" text-anchor="middle" class="l">checks</text>

  <path class="arrow2" d="M1040 735 H1140"/>
  <text x="1090" y="721" text-anchor="middle" class="l">decide()</text>

  <!-- LiveKit to Photon voice number, routed under the server -->
  <path class="arrow2" d="M1300 830 V940 H385 V835"/>
  <text x="840" y="932" text-anchor="middle" class="l">the call: LiveKit to Photon's number over SIP</text>

  <path class="arrow2" d="M300 750 H260"/>

  <!-- Legend -->
  <g transform="translate(40 880)">
    <text x="0" y="0" class="l">Who does what</text>
    <rect x="0" y="14" width="18" height="18" rx="4" fill="#e4f1e9" stroke="#17794a"/><text x="28" y="28" class="s">Nemotron decides</text>
    <rect x="0" y="40" width="18" height="18" rx="4" fill="#14130f"/><text x="28" y="54" class="s">Code does the math</text>
    <rect x="200" y="14" width="18" height="18" rx="4" fill="#fbf0d8" stroke="#c98700"/><text x="228" y="28" class="s">Claude checks</text>
    <rect x="200" y="40" width="18" height="18" rx="4" fill="#ffe9d6" stroke="#c4560a"/><text x="228" y="54" class="s">GPT only speaks</text>
  </g>
</svg>
